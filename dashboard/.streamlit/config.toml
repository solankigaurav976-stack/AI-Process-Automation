# Streamlit configuration for the Loan Application Process Intelligence Dashboard.
# Run from inside dashboard/:  ../.venv/bin/streamlit run app.py

[browser]
gatherUsageStats = false

[global]
# Chart clicks deliberately write the sidebar filter keys via session state (single
# source of truth for global filters); silence the duplicate-default log message.
disableWidgetStateDuplicationWarning = true

[server]
runOnSave = false
headless = true
# Serve on this machine only (not on the local network).
address = "localhost"

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans serif"
borderColor = "#e1e0d9"
showWidgetBorder = true
baseRadius = "small"
